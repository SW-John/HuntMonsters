<script>
(() => {
'use strict';
const W = 1024, H = 576;
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
// 모바일 주소창 때문에 100vh가 실제 보이는 높이보다 커서 위쪽이 잘리는 문제 → 실제 보이는 크기로 맞춤

/* ----------------------------------------------------------- 클라우드 저장 (Claude 계정에 연결)
   프로필/기록(slimehunt_*)을 localStorage에 쓸 때마다 서버 DB에도 올리고, 시작할 때 합쳐서 불러와요. */
const CLOUD = { loading: true, doc: null, ready: false, t: 0, busy: false, dirty: false, applying: false, status: '' };
const LS_SET = Storage.prototype.setItem, LS_RM = Storage.prototype.removeItem;
const ckSkip = k => !String(k).startsWith('slimehunt_') || k === 'slimehunt_lastnick' || k === 'slimehunt__kts';
const ktsGet = () => { try { return JSON.parse(localStorage.getItem('slimehunt__kts') || '{}') || {}; } catch (e) { return {}; } };
const ktsSet = o => { try { LS_SET.call(localStorage, 'slimehunt__kts', JSON.stringify(o)); } catch (e) {} };
const localKeys = () => { const a = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && !ckSkip(k)) a.push(k); } } catch (e) {} return a; };
function ckTouch(k) { if (CLOUD.applying || ckSkip(k)) return; const t = ktsGet(); t[k] = Date.now(); ktsSet(t); cloudPush(); }
Storage.prototype.setItem = function (k, v) { LS_SET.call(this, k, v); if (this === localStorage) ckTouch(k); };
Storage.prototype.removeItem = function (k) { LS_RM.call(this, k); if (this === localStorage) ckTouch(k); };
function mergeCloud(d) {
  const rb = d.blob || {}, rk = d.kts || {}, lk = ktsGet(), keys = new Set([...Object.keys(rb), ...Object.keys(lk), ...localKeys()]);
  CLOUD.applying = true;
  try {
    for (const k of keys) {
      if (ckSkip(k)) continue;
      const lt = lk[k] || 0, rt = rk[k] || 0, has = Object.prototype.hasOwnProperty.call(rb, k);
      if (k === 'slimehunt_profiles') {   // 프로필은 닉네임별로 합쳐요 (양쪽 계정 모두 살림)
        let lv = {}, rv = {}; try { lv = JSON.parse(localStorage.getItem(k) || '{}') || {}; } catch (e) {} try { rv = JSON.parse(rb[k] || '{}') || {}; } catch (e) {}
        LS_SET.call(localStorage, k, JSON.stringify(rt > lt ? Object.assign({}, lv, rv) : Object.assign({}, rv, lv))); lk[k] = Math.max(lt, rt, 1); continue;
      }
      if (has && rt > lt) { if (rb[k] === null) LS_RM.call(localStorage, k); else LS_SET.call(localStorage, k, rb[k]); lk[k] = rt; }
    }
    ktsSet(lk);
  } finally { CLOUD.applying = false; }
}
/* ---- Claude 밖(예: GitHub Pages)에서는 닉네임별로 공개 키-값 저장소(kvdb.io)에 올려요 */
const KV_BUCKET = '2rxUTnUM1V4VaRvKDi48y6', KV_URL = 'https://kvdb.io/' + KV_BUCKET + '/';
const KVC = { on: false, nick: null };
const kvKey = nick => 'a_' + Array.from(new TextEncoder().encode(nick)).map(b => b.toString(16).padStart(2, '0')).join('');
async function kvGet(nick) {   // signal(AbortController)을 쓰면 일부 환경(fetch를 중계하는 곳)에서 postMessage 오류가 나서, 시간 제한은 Promise.race로 해요
  const to = new Promise((_, rej) => setTimeout(() => rej(new Error('시간 초과')), 9000));
  const r = await Promise.race([fetch(KV_URL + kvKey(nick) + '?_=' + Date.now()), to]);
  if (r.status === 404) return null; if (!r.ok) throw new Error('HTTP ' + r.status);
  const t = await Promise.race([r.text(), to]); if (!t) return null; return JSON.parse(t);
}
async function kvPut(nick, obj) {
  const r = await fetch(KV_URL + kvKey(nick), { method: 'POST', body: JSON.stringify(obj) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
}
const kvErr = e => String((e && e.name === 'AbortError') ? '시간 초과' : (e && e.message) || e).slice(0, 30);
const kvScope = k => !!KVC.nick && k.startsWith('slimehunt_u_' + KVC.nick + '_');
function kvAttach(nick) { KVC.nick = nick; CLOUD.doc = { set: o => kvPut(nick, o) }; CLOUD.ready = true; CLOUD.status = 'ok'; cloudPush(true); }
function kvDetach() { if (KVC.on && CLOUD.ready && CLOUD.dirty) cloudFlush(); if (KVC.on) { CLOUD.ready = false; CLOUD.doc = null; KVC.nick = null; } }
async function cloudInit() {
  try {
    const cl = window.claude; if (!cl || !cl.use) { KVC.on = !!KV_BUCKET; return; }
    const to = new Promise(r => setTimeout(() => r(null), 8000));
    const db = await Promise.race([cl.use('db'), to]), user = await Promise.race([cl.use('user'), to]);
    if (!db || !user || !user.id) return;
    const id = await Promise.race([user.id(), to]); if (!id) return;
    const doc = db.collection('data/users/' + id).doc('save');
    const snap = await Promise.race([doc.get(), to]); if (!snap) return;
    if (snap.exists) mergeCloud(snap.data() || {});
    CLOUD.doc = doc; CLOUD.ready = true; CLOUD.status = 'ok'; cloudPush(true);
  } catch (e) { CLOUD.status = 'err'; }
}
function cloudPush(now) { if (!CLOUD.doc || !CLOUD.ready) return; CLOUD.dirty = true; clearTimeout(CLOUD.t); CLOUD.t = setTimeout(cloudFlush, now ? 100 : 1500); }
async function cloudFlush() {
  if (!CLOUD.dirty) return; if (CLOUD.busy) { CLOUD.t = setTimeout(cloudFlush, 800); return; }
  CLOUD.busy = true; CLOUD.dirty = false;
  try {
    const blob = {}, kts0 = ktsGet(), kts = {}, kv = KVC.on; localKeys().forEach(k => { if (kv && !kvScope(k)) return; blob[k] = localStorage.getItem(k); if (!kts0[k]) kts0[k] = 1; });
    Object.keys(kts0).forEach(k => { if (kv && !kvScope(k)) return; kts[k] = kts0[k]; if (!(k in blob)) blob[k] = null; });
    const doc = { ts: Date.now(), blob, kts }; if (kv) doc.prof = getProfiles()[KVC.nick] || null;
    await CLOUD.doc.set(doc); CLOUD.status = 'ok';
  } catch (e) { CLOUD.status = 'err'; CLOUD.dirty = true; }
  CLOUD.busy = false;
}
window.addEventListener('pagehide', () => { if (CLOUD.dirty) cloudFlush(); });
let deskMode = false;
// 화면 맞추기: 기본은 보이는 영역 전체. Claude 앱 안(iframe)에서 위쪽이 막대에 잘려 보이면 '실제로 보이는 영역'만큼만 정확히 맞춤 (임의로 줄이지 않음)
const VIS = { x: 0, y: 0, w: 0, h: 0, ok: false };
function fitCanvas() {
  const useVis = VIS.ok && !deskMode;
  const w = useVis ? VIS.w : window.innerWidth, h = useVis ? VIS.h : window.innerHeight;
  const cw = Math.floor(Math.min(w, h * 16 / 9));
  Object.assign(document.body.style, { top: (useVis ? VIS.y : 0) + 'px', left: (useVis ? VIS.x : 0) + 'px', width: w + 'px', height: h + 'px', right: 'auto', bottom: 'auto' });
  cv.style.width = cw + 'px'; cv.style.height = Math.round(cw * 9 / 16) + 'px';
}
let fitW = 0, fitH = 0;   // 탭할 때 주소창 등으로 높이가 조금 흔들려도 다시 맞추지 않음 (15% 이상 바뀔 때만)
const fitOnce = () => { const w = window.innerWidth, h = window.innerHeight; if (!fitW || w !== fitW || Math.abs(h - fitH) / fitH > 0.15) { fitW = w; fitH = h; VIS.ok = false; fitCanvas(); watchVis(); } };
let visIO = null;
function watchVis() {
  let framed = false; try { framed = window.top !== window.self; } catch (e) { framed = true; }
  if (!framed || !window.IntersectionObserver || !(matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches)) return;
  if (visIO) visIO.disconnect();
  const probe = document.getElementById('probe');
  let n = 0;
  visIO = new IntersectionObserver(es => {
    const e = es[es.length - 1], ir = e.intersectionRect, br = e.boundingClientRect;
    if (!ir.width || !ir.height || n++ > 3) return;   // 처음 몇 번만 측정 (탭으로 흔들리지 않게)
    const clipped = br.height - ir.height > br.height * 0.04 || br.width - ir.width > br.width * 0.04;
    if (clipped) { VIS.x = Math.max(0, ir.left); VIS.y = Math.max(0, ir.top); VIS.w = ir.width; VIS.h = ir.height; VIS.ok = true; fitCanvas(); }
  }, { threshold: [0, 0.5, 0.7, 0.8, 0.9, 1] });
  visIO.observe(probe);
}
fitOnce(); window.addEventListener('resize', fitOnce); window.addEventListener('orientationchange', () => setTimeout(fitOnce, 250));

ctx.imageSmoothingEnabled = false;
